<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="monogram">SK</div>
      <span class="site-name">Finance<span class="accent">Tracker</span></span>
    </div>
    <div class="nav-right">
      <span class="nav-bal-label">balance</span>
      <span class="nav-bal-val" id="navBalance">₹0</span>
    </div>
  </nav>

  <div class="layout">

    <aside class="sidebar">

      <div class="bal-card">
        <p class="bal-eyebrow">current balance</p>
        <h1 class="bal-figure" id="balFigure">₹0</h1>
        <div class="bal-row">
          <span class="inc-tag">↑ <span id="incTotal">₹0</span></span>
          <span class="exp-tag">↓ <span id="expTotal">₹0</span></span>
        </div>
      </div>

      <div class="form-card">
        <p class="card-title">add transaction</p>

        <div class="toggle-row">
          <button class="tog-btn tog-inc active" id="incBtn" onclick="switchType('income')">+ income</button>
          <button class="tog-btn tog-exp" id="expBtn" onclick="switchType('expense')">− expense</button>
        </div>

        <label class="field-label" for="desc">what's this for?</label>
        <input class="field" type="text" id="desc" placeholder="salary, groceries, rent…" autocomplete="off"/>

        <label class="field-label" for="amt">amount (₹)</label>
        <input class="field" type="number" id="amt" placeholder="0" min="0" step="any"/>

        <label class="field-label" for="cat">category</label>
        <select class="field" id="cat">
          <option value="">pick one</option>
          <optgroup label="Income">
            <option value="Salary">Salary</option>
            <option value="Freelance">Freelance</option>
            <option value="Investment">Investment</option>
            <option value="Gift">Gift</option>
          </optgroup>
          <optgroup label="Expense">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </optgroup>
        </select>

        <label class="field-label" for="txDate">date</label>
        <input class="field" type="date" id="txDate"/>

        <button class="submit-btn" onclick="addTx()">add →</button>
      </div>

    </aside>

    <main class="main-content">

      <div class="tx-card">
        <div class="tx-header">
          <p class="card-title">transactions</p>
          <div class="filter-bar" id="filterBar">
            <span class="f-chip active" onclick="applyFilter('all', this)">all</span>
            <span class="f-chip" onclick="applyFilter('income', this)">income</span>
            <span class="f-chip" onclick="applyFilter('expense', this)">expense</span>
            <span class="f-chip" onclick="applyFilter('Food', this)">food</span>
            <span class="f-chip" onclick="applyFilter('Transport', this)">transport</span>
            <span class="f-chip" onclick="applyFilter('Shopping', this)">shopping</span>
            <span class="f-chip" onclick="applyFilter('Bills', this)">bills</span>
          </div>
        </div>
        <div id="txList"></div>
      </div>

      <div class="chart-card">
        <p class="card-title">spending breakdown</p>
        <div class="chart-area">
          <p class="empty-hint" id="chartHint">add expenses to see the chart</p>
          <canvas id="donut" style="display:none; max-height:240px;"></canvas>
        </div>
      </div>

    </main>
  </div>

  <div class="toast" id="toast">
    <span id="toastText">done</span>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- Chart.js for pie chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Our CSS file -->
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Finance<span>Tracker</span></div>
  </nav>

  <div class="container">

    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="summary-card balance">
        <div class="card-label">Total Balance</div>
        <div class="card-amount balance" id="balanceAmt">₹0</div>
        <div class="card-icon">💳</div>
      </div>
      <div class="summary-card income">
        <div class="card-label">Total Income</div>
        <div class="card-amount income" id="incomeAmt">₹0</div>
        <div class="card-icon">📈</div>
      </div>
      <div class="summary-card expense">
        <div class="card-label">Total Expenses</div>
        <div class="card-amount expense" id="expenseAmt">₹0</div>
        <div class="card-icon">📉</div>
      </div>
    </div>

    <!-- Form + Chart -->
    <div class="main-grid">

      <!-- Add Transaction Form -->
      <div class="form-card">
        <div class="section-title"><span class="dot"></span> Add Transaction</div>

        <!-- Income / Expense toggle -->
        <div class="type-toggle">
          <button class="type-btn active-income" id="incomeBtn" onclick="setType('income')">+ Income</button>
          <button class="type-btn" id="expenseBtn" onclick="setType('expense')">- Expense</button>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="desc" placeholder="e.g. Salary, Groceries..."/>
        </div>

        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" min="0"/>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="">Select category</option>
            <!-- income categories -->
            <option value="Salary">💼 Salary</option>
            <option value="Freelance">💻 Freelance</option>
            <option value="Investment">📊 Investment</option>
            <option value="Gift">🎁 Gift</option>
            <!-- expense categories -->
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">💡 Bills</option>
            <option value="Health">🏥 Health</option>
            <option value="Education">📚 Education</option>
            <option value="Entertainment">🎮 Entertainment</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="txDate"/>
        </div>

        <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
      </div>

      <!-- Pie Chart -->
      <div class="chart-card">
        <div class="section-title"><span class="dot"></span> Spending Breakdown</div>
        <div class="chart-wrapper">
          <!-- shown when no expense data exists -->
          <div class="chart-empty" id="chartEmpty">
            <div class="emoji">📊</div>
            <p>Add some transactions<br/>to see your breakdown</p>
          </div>
          <!-- actual pie chart canvas -->
          <canvas id="pieChart" style="display:none; max-height: 280px;"></canvas>
        </div>
      </div>

    </div>

    <!-- Transactions List -->
    <div class="transactions-card">
      <div class="section-title"><span class="dot"></span> Transactions</div>

      <!-- filter buttons -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterTx('all', this)">All</button>
        <button class="filter-btn" onclick="filterTx('income', this)">Income</button>
        <button class="filter-btn" onclick="filterTx('expense', this)">Expense</button>
        <button class="filter-btn" onclick="filterTx('Food', this)">Food</button>
        <button class="filter-btn" onclick="filterTx('Transport', this)">Transport</button>
        <button class="filter-btn" onclick="filterTx('Shopping', this)">Shopping</button>
        <button class="filter-btn" onclick="filterTx('Bills', this)">Bills</button>
      </div>

      <!-- transaction list renders here by JS -->
      <div id="txList"></div>
    </div>

  </div>

  <!-- Toast notification popup -->
  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMsg">Transaction added!</span>
  </div>

  <!-- Our JS file - always load at bottom -->
  <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="logo">Finance<span>Tracker</span></div>
    <div class="nav-date" id="navDate"></div>
  </nav>

  <div class="container">

    <div class="summary-grid">
      <div class="summary-card">
        <div class="card-top">
          <div class="card-label">Total Balance</div>
          <div class="card-icon">💳</div>
        </div>
        <div class="card-amount balance" id="balanceAmt">₹0</div>
        <div class="card-tag">Net worth</div>
      </div>
      <div class="summary-card">
        <div class="card-top">
          <div class="card-label">Total Income</div>
          <div class="card-icon">📈</div>
        </div>
        <div class="card-amount income" id="incomeAmt">₹0</div>
        <div class="card-tag">This period</div>
      </div>
      <div class="summary-card">
        <div class="card-top">
          <div class="card-label">Total Expenses</div>
          <div class="card-icon">📉</div>
        </div>
        <div class="card-amount expense" id="expenseAmt">₹0</div>
        <div class="card-tag">This period</div>
      </div>
    </div>

    <div class="main-grid">

      <div class="form-card">
        <div class="section-title">Add Transaction</div>

        <div class="type-toggle">
          <button class="type-btn active-income" id="incomeBtn" onclick="setType('income')">+ Income</button>
          <button class="type-btn" id="expenseBtn" onclick="setType('expense')">- Expense</button>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="desc" placeholder="e.g. Salary, Groceries..."/>
        </div>
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" min="0"/>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="">Select category</option>
            <option value="Salary">💼 Salary</option>
            <option value="Freelance">💻 Freelance</option>
            <option value="Investment">📊 Investment</option>
            <option value="Gift">🎁 Gift</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">💡 Bills</option>
            <option value="Health">🏥 Health</option>
            <option value="Education">📚 Education</option>
            <option value="Entertainment">🎮 Entertainment</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="txDate"/>
        </div>

        <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
      </div>

      <div class="chart-card">
        <div class="section-title">Spending Breakdown</div>
        <div class="chart-wrapper">
          <div class="chart-empty" id="chartEmpty">
            <div class="emoji">📊</div>
            <p>Add some transactions<br/>to see your breakdown</p>
          </div>
          <canvas id="pieChart" style="display:none; max-height:280px;"></canvas>
        </div>
      </div>

    </div>

    <div class="transactions-card">
      <div class="section-title">Transactions</div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterTx('all', this)">All</button>
        <button class="filter-btn" onclick="filterTx('income', this)">Income</button>
        <button class="filter-btn" onclick="filterTx('expense', this)">Expense</button>
        <button class="filter-btn" onclick="filterTx('Food', this)">Food</button>
        <button class="filter-btn" onclick="filterTx('Transport', this)">Transport</button>
        <button class="filter-btn" onclick="filterTx('Shopping', this)">Shopping</button>
        <button class="filter-btn" onclick="filterTx('Bills', this)">Bills</button>
      </div>
      <div id="txList"></div>
    </div>

  </div>

  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMsg">Transaction added!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
